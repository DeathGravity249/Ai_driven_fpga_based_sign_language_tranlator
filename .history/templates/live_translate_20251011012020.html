{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h2>Live Sign Language Translation</h2>
            <div class="card">
                <div class="card-body">
                    <div class="video-container text-center">
                        <img id="cameraFeed" src="{{ url_for('video_feed') }}" 
                             alt="Live Camera Feed" class="img-fluid rounded">
                    </div>
                </div>
            </div>
        </div>
        
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Translation Controls</h5>
                </div>
                <div class="card-body">
                    <div class="d-grid gap-2">
                        <button id="startBtn" class="btn btn-success btn-lg">
                            ▶ Start Translation
                        </button>
                        <button id="stopBtn" class="btn btn-danger btn-lg" disabled>
                            ⏹ Stop Translation
                        </button>
                    </div>
                    
                    <div class="mt-4">
                        <h6>Model Status:</h6>
                        <div id="modelStatus" class="alert alert-info">
                            Checking...
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="card mt-3">
                <div class="card-header">
                    <h5 class="card-title mb-0">Translation Result</h5>
                </div>
                <div class="card-body">
                    <div id="translationText" class="translation-output">
                        <p class="text-muted">Translation will appear here...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const translationText = document.getElementById('translationText');
        const modelStatus = document.getElementById('modelStatus');
        const cameraFeed = document.getElementById('cameraFeed');

        // Check model status
        function checkModelStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    if (data.model_loaded) {
                        modelStatus.innerHTML = '<span class="text-success">✅ AI Model Loaded</span>';
                        startBtn.disabled = false;
                    } else {
                        modelStatus.innerHTML = '<span class="text-warning">🔄 Loading AI Model...</span>';
                        startBtn.disabled = true;
                        // Check again in 2 seconds
                        setTimeout(checkModelStatus, 2000);
                    }
                })
                .catch(error => {
                    modelStatus.innerHTML = '<span class="text-danger">❌ Error checking status</span>';
                });
        }

        // Start translation
        startBtn.addEventListener('click', function() {
            fetch('/start_translation')
                .then(response => response.json())
                .then(data => {
                    translationText.innerHTML = `<p class="text-success"><strong>${data.message}</strong></p>`;
                    startBtn.disabled = true;
                    stopBtn.disabled = false;
                    
                    // Simulate translation results (replace with actual WebSocket/SSE)
                    setTimeout(() => {
                        translationText.innerHTML = `
                            <p><strong>Detected Sign:</strong> Hello</p>
                            <p><strong>Confidence:</strong> 95%</p>
                            <p><strong>Translation:</strong> Hello! How are you?</p>
                        `;
                    }, 2000);
                })
                .catch(error => {
                    translationText.innerHTML = `<p class="text-danger">Error starting translation: ${error}</p>`;
                });
        });

        // Stop translation
        stopBtn.addEventListener('click', function() {
            fetch('/stop_translation')
                .then(response => response.json())
                .then(data => {
                    translationText.innerHTML = `<p class="text-info">${data.message}</p>`;
                    startBtn.disabled = false;
                    stopBtn.disabled = true;
                })
                .catch(error => {
                    translationText.innerHTML = `<p class="text-danger">Error stopping translation: ${error}</p>`;
                });
        });

        // Initial status check
        checkModelStatus();
    });
</script>

<style>
    .video-container {
        background: #000;
        padding: 10px;
        border-radius: 8px;
    }
    
    .translation-output {
        min-height: 150px;
        padding: 15px;
        background: #f8f9fa;
        border-radius: 5px;
        border: 1px solid #dee2e6;
    }
    
    .btn {
        margin: 5px 0;
    }
</style>
{% endblock %}
