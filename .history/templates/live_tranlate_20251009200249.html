{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-6xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-8">Live Sign Language Translation</h1>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Camera Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-semibold mb-4">Camera Feed</h2>
                <div class="border-2 border-dashed border-gray-300 rounded-lg mb-4 h-96 flex items-center justify-center">
                    <div id="cameraPlaceholder" class="text-center">
                        <i class="fas fa-camera text-gray-400 text-4xl mb-2"></i>
                        <p class="text-gray-500">Camera feed will appear here</p>
                    </div>
                    <img id="cameraFeed" class="w-full h-full object-cover rounded-lg hidden" />
                </div>
                <div class="flex space-x-4">
                    <button id="startBtn" class="flex-1 bg-green-500 text-white py-3 rounded-lg font-semibold hover:bg-green-600 transition duration-300">
                        <i class="fas fa-play mr-2"></i>Start Camera
                    </button>
                    <button id="stopBtn" class="flex-1 bg-red-500 text-white py-3 rounded-lg font-semibold hover:bg-red-600 transition duration-300" disabled>
                        <i class="fas fa-stop mr-2"></i>Stop Camera
                    </button>
                </div>
            </div>

            <!-- Translation Results -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-2xl font-semibold mb-4">Translation Results</h2>
                <div class="bg-gray-100 rounded-lg p-6 min-h-64">
                    <div id="translationResult" class="text-2xl font-semibold text-center text-gray-500">
                        Start camera to see translations...
                    </div>
                </div>
                
                <div class="mt-6">
                    <h3 class="text-lg font-semibold mb-2">Translation Log</h3>
                    <div id="translationHistory" class="space-y-2 max-h-32 overflow-y-auto bg-gray-50 p-3 rounded">
                        <!-- History will appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('startBtn').addEventListener('click', function() {
    // Simulate camera start
    document.getElementById('cameraPlaceholder').classList.add('hidden');
    document.getElementById('cameraFeed').classList.remove('hidden');
    document.getElementById('cameraFeed').src = "https://via.placeholder.com/640x480/4F46E5/FFFFFF?text=Live+Camera+Feed";
    
    document.getElementById('startBtn').disabled = true;
    document.getElementById('stopBtn').disabled = false;
    
    // Simulate translations
    simulateTranslations();
});

document.getElementById('stopBtn').addEventListener('click', function() {
    document.getElementById('cameraPlaceholder').classList.remove('hidden');
    document.getElementById('cameraFeed').classList.add('hidden');
    
    document.getElementById('startBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;
    
    document.getElementById('translationResult').textContent = "Camera stopped";
    document.getElementById('translationResult').className = "text-2xl font-semibold text-center text-gray-500";
});

function simulateTranslations() {
    const signs = ["Hello", "Thank you", "Please", "Help", "Yes", "No", "Water", "Food", "Good morning", "How are you?"];
    let index = 0;
    
    const interval = setInterval(() => {
        if (document.getElementById('stopBtn').disabled) {
            clearInterval(interval);
            return;
        }
        
        const translation = signs[index % signs.length];
        document.getElementById('translationResult').textContent = translation;
        document.getElementById('translationResult').className = "text-2xl font-semibold text-center text-green-600";
        
        addToHistory(translation);
        index++;
    }, 3000);
}

function addToHistory(translation) {
    const history = document.getElementById('translationHistory');
    const timestamp = new Date().toLocaleTimeString();
    const historyItem = document.createElement('div');
    historyItem.className = 'text-sm border-b border-gray-200 pb-1';
    historyItem.innerHTML = `<span class="font-semibold">${timestamp}:</span> ${translation}`;
    
    history.insertBefore(historyItem, history.firstChild);
    
    if (history.children.length > 5) {
        history.removeChild(history.lastChild);
    }
}
</script>
{% endblock %}
