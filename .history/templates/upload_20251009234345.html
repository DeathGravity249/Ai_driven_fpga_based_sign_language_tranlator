{% extends "base.html" %}

{% block content %}
<div class="min-h-screen bg-gray-50 py-8">
    <div class="max-w-4xl mx-auto px-4">
        <h1 class="text-4xl font-bold text-center mb-8">Upload Sign Language Image</h1>
        
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h2 class="text-2xl font-semibold mb-4">Upload Image for Translation</h2>
            
            <div class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center mb-4">
                <i class="fas fa-cloud-upload-alt text-gray-400 text-4xl mb-2"></i>
                <p class="text-gray-500 mb-4">Upload a sign language image for translation</p>
                <input type="file" id="imageInput" accept="image/*" class="hidden" />
                <label for="imageInput" class="bg-purple-600 text-white px-6 py-2 rounded-lg cursor-pointer hover:bg-purple-700 transition duration-300">
                    Choose Image File
                </label>
            </div>
            
            <div class="bg-gray-100 rounded-lg p-6 text-center">
                <p class="text-gray-600">Image upload functionality coming soon!</p>
                <p class="text-sm text-gray-500 mt-2">Your AI model is loaded and ready for integration.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
