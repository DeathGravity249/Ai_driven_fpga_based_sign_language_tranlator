<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SignSpeak AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white shadow-lg fixed w-full top-0 z-50">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-purple-600">SignSpeak AI</span>
                </div>
                <div class="flex space-x-4">
                    <a href="/" class="text-gray-700 hover:text-purple-600 px-3 py-2 rounded-md font-medium">Home</a>
                    <a href="/live-translate" class="text-gray-700 hover:text-purple-600 px-3 py-2 rounded-md font-medium">Live Translate</a>
                    <a href="/upload-translate" class="text-gray-700 hover:text-purple-600 px-3 py-2 rounded-md font-medium">Upload</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-16">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
